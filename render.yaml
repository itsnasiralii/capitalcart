services:
  - type: web
    name: capitalcart-pk
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: CapitalCart.pk
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 1440
      - key: FORCE_HTTPS
        value: true
      - key: RUN_MIGRATIONS
        value: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: capitalcart-db
          property: connectionString

databases:
  - name: capitalcart-db
    plan: free
    region: oregon
    databaseName: capitalcart
    user: capitalcart_user
