name: Laravel tests and production image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: gd, exif, pdo_sqlite, mbstring, intl, bcmath, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies and compile views/assets
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          php artisan key:generate
          npm ci
          npm run build
          php artisan view:cache
      - name: Run regression and upload tests
        run: php artisan test
      - name: Build the Render Docker image
        run: docker build -t capitalcart-test .
      - name: Verify production image support and PHP upload limits
        run: >-
          docker run --rm --entrypoint php capitalcart-test -r
          'if (!function_exists("imagewebp") || !gd_info()["WebP Support"] || ini_get("upload_max_filesize") !== "6M" || ini_get("post_max_size") !== "48M") { exit(1); } echo "WebP and upload configuration OK\n";'
