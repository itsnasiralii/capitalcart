name: Laravel tests and production image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: capitalcart_test
          POSTGRES_USER: capitalcart_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U capitalcart_test -d capitalcart_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: gd, exif, pdo_sqlite, pdo_pgsql, mbstring, intl, bcmath, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies and compile views/assets
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          php artisan key:generate
          npm ci
          npm run build
          php artisan view:cache
      - name: Run regression and upload tests
        run: |
          find app routes database -name '*.php' -print0 | xargs -0 -n1 php -l
          php artisan test
      - name: Verify uploads and orders on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: capitalcart_test
          DB_USERNAME: capitalcart_test
          DB_PASSWORD: test-only-password
          DB_URL: ''
        run: php artisan test --filter 'CatalogImageUploadsTest|OrderCreationAndWhatsAppTest|CustomerPrivacyMaskingTest'
      - name: Build the Render Docker image
        run: docker build -t capitalcart-test .
      - name: Verify production image support and PHP upload limits
        run: >-
          docker run --rm --entrypoint php capitalcart-test -r
          'if (!function_exists("imagewebp") || !gd_info()["WebP Support"] || ini_get("upload_max_filesize") !== "25M" || ini_get("post_max_size") !== "30M") { exit(1); } echo "WebP and upload configuration OK\n";'
